<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Camera | Crowd Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ==========================================================================
       Neo-Brutalism UI Design Tokens
       ========================================================================== */
    :root {
      --neo-bg: #FAF7F2;
      --neo-surface: #FFFFFF;
      --neo-black: #000000;
      --neo-yellow: #FFE500;
      --neo-cyan: #A6FAFF;
      --neo-lime: #B8FF9F;
      --neo-pink: #FFA6F6;
      --neo-red: #FF9F9F;
      --neo-shadow: 4px 4px 0px #000000;
      --neo-shadow-lg: 6px 6px 0px #000000;
      --neo-shadow-xl: 8px 8px 0px #000000;
      --font-display: 'Space Grotesk', -apple-system, sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--neo-bg);
      font-family: var(--font-sans);
      color: var(--neo-black);
      min-height: 100vh;
      padding-top: 85px;
      background-image: radial-gradient(var(--neo-black) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* getlayers.ai Fluid Follower Cursor */
    @media (pointer: fine) {
      .layers-cursor-dot {
        position: fixed; top: 0; left: 0; width: 8px; height: 8px; background-color: var(--neo-black); border-radius: 50%; pointer-events: none; z-index: 99999; transform: translate(-50%, -50%);
      }
      .layers-cursor-follower {
        position: fixed; top: 0; left: 0; width: 36px; height: 36px; border: 2px solid var(--neo-black); background: rgba(255, 229, 0, 0.4); border-radius: 50%; box-shadow: 2px 2px 0px var(--neo-black); pointer-events: none; z-index: 99998; transform: translate(-50%, -50%); transition: width 0.25s ease, height 0.25s ease;
      }
      .layers-cursor-follower.hovering {
        width: 60px; height: 60px; background: rgba(166, 250, 255, 0.55); border-color: var(--neo-black); box-shadow: 4px 4px 0px var(--neo-black);
      }
    }
    @media (pointer: coarse) {
      .layers-cursor-dot, .layers-cursor-follower { display: none !important; }
    }

    /* Navbar */
    .cms-navbar {
      background-color: var(--neo-surface);
      border-bottom: 4px solid var(--neo-black);
      padding: 0.85rem 0;
    }
    .brand-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--neo-black);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.2rem;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--neo-yellow);
      border: 2px solid var(--neo-black);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--neo-black);
      font-weight: 800;
      box-shadow: 2px 2px 0px var(--neo-black);
    }
    .nav-btn-link {
      color: var(--neo-black);
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      padding: 0.4rem 0.85rem;
      border: 2px solid transparent;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .nav-btn-link:hover {
      background: var(--neo-yellow);
      border-color: var(--neo-black);
      box-shadow: 2px 2px 0px var(--neo-black);
      transform: translate(-1px, -1px);
      color: var(--neo-black);
    }

    .camera-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem 1.5rem;
    }

    .camera-card {
      background: var(--neo-surface);
      border: 3px solid var(--neo-black);
      border-radius: 14px;
      padding: 2.2rem;
      box-shadow: var(--neo-shadow-xl);
      margin-bottom: 2rem;
    }

    .camera-card h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 2rem;
      color: var(--neo-black);
      letter-spacing: -0.02em;
    }

    /* Video Container */
    .video-container {
      position: relative;
      background: #000000;
      border: 3px solid var(--neo-black);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
      min-height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--neo-shadow-lg);
    }

    #cameraStream {
      width: 100%;
      height: auto;
      max-height: 600px;
      object-fit: contain;
    }

    .camera-status {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--neo-surface);
      color: var(--neo-black);
      padding: 0.45rem 0.95rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--font-mono);
      border: 2px solid var(--neo-black);
      box-shadow: 3px 3px 0px var(--neo-black);
      z-index: 10;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .live-indicator::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--neo-black);
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.4; }
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      border: 3px solid var(--neo-black);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
      box-shadow: var(--neo-shadow);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .stat-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--neo-shadow-lg);
    }

    .stat-card-yellow { background: var(--neo-yellow); }
    .stat-card-cyan { background: var(--neo-cyan); }
    .stat-card-lime { background: var(--neo-lime); }
    .stat-card-pink { background: var(--neo-pink); }

    .stat-number {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--neo-black);
      display: block;
      font-family: var(--font-mono);
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--neo-black);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: var(--font-mono);
      margin-top: 0.35rem;
      display: block;
    }

    /* Controls */
    .controls-section {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .control-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.6rem;
      border: 3px solid var(--neo-black);
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      font-family: var(--font-sans);
      color: var(--neo-black);
      cursor: pointer;
      box-shadow: var(--neo-shadow);
      user-select: none;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.12s cubic-bezier(0.2, 0, 0, 1);
    }
    .control-btn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: var(--neo-shadow-lg);
    }
    .control-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--neo-black);
    }
    .control-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn-start { background: var(--neo-yellow); }
    .btn-stop { background: var(--neo-red); }
    .btn-heatmap { background: var(--neo-cyan); }
    .btn-secondary-neo { background: var(--neo-surface); }

    .error-message {
      background: var(--neo-red);
      color: var(--neo-black);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      margin: 1.5rem 0;
      text-align: center;
      border: 3px solid var(--neo-black);
      font-weight: 700;
      box-shadow: var(--neo-shadow);
    }

    .loading-spinner {
      display: none;
      text-align: center;
      color: #FFFFFF;
    }

    @media (max-width: 768px) {
      .camera-container { padding: 1rem; }
      .controls-section { flex-direction: column; align-items: center; }
      .control-btn { width: 100%; max-width: 320px; }
    }
  </style>
</head>
<body>

  <!-- getlayers.ai Fluid Follower Cursor Elements -->
  <div class="layers-cursor-dot" id="cursorDot"></div>
  <div class="layers-cursor-follower" id="cursorFollower"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top cms-navbar">
    <div class="container">
      <a class="brand-wrap" href="/">
        <span class="brand-icon">C</span>
        <span>Crowd Management System</span>
      </a>
      <div class="navbar-nav ms-auto d-flex flex-row gap-2">
        <a class="nav-btn-link" href="/">Dashboard</a>
        <a class="nav-btn-link" href="/live_preview">Live Stream</a>
        <a class="nav-btn-link" href="/video_studio">Video Studio</a>
      </div>
    </div>
  </nav>

  <div class="camera-container">
    <div class="camera-card">
      <h1 class="text-center mb-4">
        <i class="bi bi-camera-video me-2"></i>Live Camera Analysis
      </h1>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card stat-card-yellow">
          <span class="stat-number" id="peopleCount">0</span>
          <span class="stat-label">People Detected</span>
        </div>
        <div class="stat-card stat-card-cyan">
          <span class="stat-number" id="densityLevel">Low</span>
          <span class="stat-label">Crowd Density</span>
        </div>
        <div class="stat-card stat-card-lime">
          <span class="stat-number" id="alertStatus">Safe</span>
          <span class="stat-label">Safety Status</span>
        </div>
        <div class="stat-card stat-card-pink">
          <span class="stat-number" id="fps">0</span>
          <span class="stat-label">FPS</span>
        </div>
      </div>

      <!-- Video Container -->
      <div class="video-container">
        <div class="camera-status">
          <div class="live-indicator" id="cameraStatus">
            <span>Camera Off</span>
          </div>
        </div>
        <img id="cameraStream" src="" alt="Camera Stream" style="display: none;" />
        <div id="cameraPlaceholder" class="text-center text-white p-4">
          <i class="bi bi-camera-video" style="font-size: 4rem; opacity: 0.85;"></i>
          <p class="mt-3 font-mono fw-bold" style="letter-spacing: 0.5px;">Click "Start Camera" to begin live edge analysis</p>
        </div>
        <div class="loading-spinner" id="loadingSpinner">
          <div class="spinner-border text-warning" style="width: 3.5rem; height: 3.5rem; border-width: 4px;"></div>
          <p class="mt-3 font-mono fw-bold">Initializing camera device...</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-section">
        <button class="control-btn btn-start" id="startCameraBtn">
          <i class="bi bi-play-fill me-2"></i>Start Camera
        </button>
        <button class="control-btn btn-stop" id="stopCameraBtn" disabled>
          <i class="bi bi-stop-fill me-2"></i>Stop Camera
        </button>
        <button class="control-btn btn-heatmap" id="toggleHeatmapBtn" disabled>
          <i class="bi bi-thermometer-half me-2"></i>Toggle Heatmap
        </button>
        <button class="control-btn btn-secondary-neo" onclick="window.location.href='/'">
          <i class="bi bi-house me-2"></i>Back to Dashboard
        </button>
      </div>

      <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>
  </div>

  <script>
    let isStreamActive = false;
    let heatmapEnabled = false;

    const cameraStream = document.getElementById('cameraStream');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const cameraStatus = document.getElementById('cameraStatus');
    const errorMessage = document.getElementById('errorMessage');
    
    const startBtn = document.getElementById('startCameraBtn');
    const stopBtn = document.getElementById('stopCameraBtn');
    const heatmapBtn = document.getElementById('toggleHeatmapBtn');

    // Start camera
    startBtn.addEventListener('click', async () => {
      try {
        showLoading(true);
        hideError();
        
        // Start camera stream on backend
        const response = await fetch('/start_camera', { method: 'POST' });
        if (!response.ok) {
          throw new Error('Failed to start camera');
        }
        
        // Start streaming
        cameraStream.src = `/camera_feed?t=${Date.now()}`;
        cameraStream.style.display = 'block';
        cameraPlaceholder.style.display = 'none';
        
        isStreamActive = true;
        updateCameraStatus('LIVE - Camera Active');
        updateControlButtons();
        startStatsUpdate();
        
        showLoading(false);
        
      } catch (error) {
        console.error('Error starting camera:', error);
        showError('Failed to start camera. Please check camera permissions and try again.');
        showLoading(false);
      }
    });

    // Stop camera
    stopBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/stop_camera', { method: 'POST' });
        
        cameraStream.style.display = 'none';
        cameraPlaceholder.style.display = 'block';
        
        isStreamActive = false;
        updateCameraStatus('Camera Off');
        updateControlButtons();
        
        // Reset stats
        document.getElementById('peopleCount').textContent = '0';
        document.getElementById('densityLevel').textContent = 'Low';
        document.getElementById('alertStatus').textContent = 'Safe';
        document.getElementById('fps').textContent = '0';
        
      } catch (error) {
        console.error('Error stopping camera:', error);
        showError('Failed to stop camera.');
      }
    });

    // Toggle heatmap
    heatmapBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/toggle_camera_heatmap', { method: 'POST' });
        if (response.ok) {
          heatmapEnabled = !heatmapEnabled;
          heatmapBtn.innerHTML = `<i class="bi bi-thermometer-half me-2"></i>${heatmapEnabled ? 'Disable' : 'Enable'} Heatmap`;
        }
      } catch (error) {
        console.error('Error toggling heatmap:', error);
      }
    });

    function updateCameraStatus(status) {
      if (status.includes('LIVE')) {
        cameraStatus.innerHTML = '<span>LIVE - Camera Active</span>';
        cameraStatus.className = 'camera-status live-indicator';
      } else {
        cameraStatus.innerHTML = '<span>Camera Off</span>';
        cameraStatus.className = 'camera-status';
      }
    }

    function updateControlButtons() {
      startBtn.disabled = isStreamActive;
      stopBtn.disabled = !isStreamActive;
      heatmapBtn.disabled = !isStreamActive;
    }

    function showLoading(show) {
      loadingSpinner.style.display = show ? 'block' : 'none';
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    function hideError() {
      errorMessage.style.display = 'none';
    }

    // Update stats from backend
    function startStatsUpdate() {
      if (!isStreamActive) return;
      
      setInterval(async () => {
        if (!isStreamActive) return;
        
        try {
          const response = await fetch('/camera_stats');
          if (response.ok) {
            const stats = await response.json();
            
            // Animate stat updates
            animateStatUpdate('peopleCount', stats.people_count || 0);
            animateStatUpdate('densityLevel', stats.density_level || 'Low');
            animateStatUpdate('alertStatus', stats.alert_status || 'Safe');
            animateStatUpdate('fps', Math.round(stats.fps || 0));
          }
        } catch (error) {
          console.error('Error fetching stats:', error);
        }
      }, 1000);
    }

    function animateStatUpdate(elementId, newValue) {
      const element = document.getElementById(elementId);
      if (!element) return;
      gsap.to(element, {
        scale: 1.1,
        duration: 0.1,
        yoyo: true,
        repeat: 1,
        onComplete: () => {
          element.textContent = newValue;
        }
      });
    }

    // Initialize page
    window.addEventListener('DOMContentLoaded', () => {
      updateControlButtons();
    });

    // getlayers.ai cursor physics
    const cursorDot = document.getElementById('cursorDot');
    const cursorFollower = document.getElementById('cursorFollower');
    if (cursorDot && cursorFollower && window.matchMedia('(pointer: fine)').matches) {
      let mouseX = -100, mouseY = -100;
      let followerX = -100, followerY = -100;
      window.addEventListener('mousemove', e => {
        mouseX = e.clientX; mouseY = e.clientY;
        cursorDot.style.left = `${mouseX}px`;
        cursorDot.style.top = `${mouseY}px`;
      });
      function renderCursor() {
        followerX += (mouseX - followerX) * 0.18;
        followerY += (mouseY - followerY) * 0.18;
        cursorFollower.style.left = `${followerX}px`;
        cursorFollower.style.top = `${followerY}px`;
        requestAnimationFrame(renderCursor);
      }
      requestAnimationFrame(renderCursor);
      document.querySelectorAll('a, button, .control-btn, .stat-card, .camera-card').forEach(el => {
        el.addEventListener('mouseenter', () => cursorFollower.classList.add('hovering'));
        el.addEventListener('mouseleave', () => cursorFollower.classList.remove('hovering'));
      });
    }
  </script>
</body>
</html>
